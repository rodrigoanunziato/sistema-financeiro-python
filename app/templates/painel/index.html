<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Sistema</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #f7f6fb;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Barra superior */
        .navbar {
            height: 35px;
            min-height: 35px;
            padding: 0 8px;
            background-color: #ffffff;
            border-bottom: 1px solid #e5e5e5;
        }

        .navbar-brand {
            margin: 0;
            padding: 0;
            color: #0866cc;
            font-size: 13px;
            font-weight: bold;
        }

        .navbar-brand:hover {
            color: #0755aa;
        }

        .usuario-nivel {
            margin-left: 5px;
            color: #333333;
            font-size: 12px;
        }

        /* Botão sair */
        .btn-sair {
            padding: 3px 8px;
            color: #ffffff;
            background-color: #dc3545;
            border: none;
            border-radius: 3px;
            font-size: 11px;
        }

        .btn-sair:hover {
            background-color: #bb2d3b;
            color: #ffffff;
        }

        /* Conteúdo principal */
        .conteudo {
            padding: 15px 5%;
        }

        .conteudo h5 {
            margin: 0;
            color: #333333;
            font-size: 14px;
            font-weight: normal;
        }
    </style>
</head>

<body>

    <!-- Barra superior -->
    <nav class="navbar d-flex justify-content-between">

        <div class="usuario-info">
            👤 <strog>{{ nome }}</strog>
            | Nível: <strong>{{ nivel }}</strong>

        </div>
            <a href="/logout" class="btn btn-danger btn-sm btn-logout">
                Sair
            </a>

    </nav>

    <!-- Conteúdo -->
    <main class="conteudo">

        <h5>Bem-vindo ao sistema</h5>

    </main>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

</body>
</html>
