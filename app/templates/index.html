
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sistema Financeiro</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS personalizado -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <!-- Cabeçalho -->
            <header class="login-header">

                <div class="logo">
                    <i class="bi bi-bank"></i>
                </div>

                <h1>Sistema Financeiro</h1>

            </header>

            <!-- Corpo do formulário -->
            <div class="login-body">

                <!-- Mensagens do Flask -->
                {% with mensagens = get_flashed_messages(with_categories=true) %}
                    {% if mensagens %}
                        {% for categoria, mensagem in mensagens %}
                            <div
                                class="alert alert-{{ categoria }} alert-dismissible fade show"
                                role="alert"
                            >
                                {{ mensagem }}

                                <button
                                    type="button"
                                    class="btn-close"
                                    data-bs-dismiss="alert"
                                    aria-label="Fechar"
                                ></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">

                    <!-- E-mail -->
                    <div class="form-group">
                        <label for="email" class="form-label">
                            <i class="bi bi-person me-2"></i>
                            E-mail
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>

                    <!-- Senha -->
                    <div class="form-group password-group">

                        <label for="senha" class="form-label">
                            <i class="bi bi-lock me-2"></i>
                            Senha
                        </label>

                        <div class="password-container">

                            <input
                                type="password"
                                class="form-control"
                                id="senha"
                                name="senha"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleSenha"
                                aria-label="Mostrar senha"
                                aria-pressed="false"
                            >
                                <i class="bi bi-eye" aria-hidden="true"></i>
                            </button>

                        </div>
                    </div>

                    <!-- Lembrar-me e esqueci minha senha -->
                    <div class="login-options">

                        <div class="remember-option">
                            <input
                                type="checkbox"
                                id="lembrar-me"
                                name="lembrar-me"
                                class="remember-checkbox"
                            >

                            <label for="lembrar-me">
                                Lembrar-me
                            </label>
                        </div>

                        <a href="#" class="forgot-password">
                            Esqueci a senha
                        </a>

                    </div>

                    <!-- Botão Entrar -->
                    <button
                        type="submit"
                        class="btn btn-login w-100"
                    >
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Entrar
                    </button>

                </form>

            </div>

        </section>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Mostrar e ocultar senha -->
    <script>
        const campoSenha = document.getElementById('senha');
        const botaoSenha = document.getElementById('toggleSenha');
        const iconeSenha = botaoSenha.querySelector('i');

        botaoSenha.addEventListener('click', function () {

            const mostrar = campoSenha.type === 'password';

            campoSenha.type = mostrar ? 'text' : 'password';

            iconeSenha.classList.toggle('bi-eye', !mostrar);
            iconeSenha.classList.toggle('bi-eye-slash', mostrar);

            botaoSenha.setAttribute(
                'aria-label',
                mostrar ? 'Ocultar senha' : 'Mostrar senha'
            );

            botaoSenha.setAttribute(
                'aria-pressed',
                String(mostrar)
            );

        });
    </script>

</body>
</html>
