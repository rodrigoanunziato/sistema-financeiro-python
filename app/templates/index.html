
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sistema Financeiro</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Cores dinâmicas do sistema -->
    <style>
    :root {
        --cor-primaria: {{ config['COR_PRIMARIA'] }};
        --cor-secundaria: {{ config['COR_SECUNDARIA'] }};
    }
    </style>

    <!-- CSS personalizado -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >

</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <!-- Cabeçalho -->
            <header class="login-header">

                <div class="logo">
                    <img
                        src="{{ url_for('static', filename='img/logo.webp') }}"
                        alt="Sistema Financeiro"
                    >
                </div>

            </header>

            <!-- Corpo do formulário -->
            <div class="login-body">

                <!-- Mensagens do Flask -->
                {% with mensagens = get_flashed_messages(with_categories=true) %}
                    {% if mensagens %}
                        {% for categoria, mensagem in mensagens %}
                            <div
                                class="alert alert-{{ categoria }} alert-dismissible fade show"
                                role="alert"
                            >
                                {{ mensagem }}

                                <button
                                    type="button"
                                    class="btn-close"
                                    data-bs-dismiss="alert"
                                    aria-label="Fechar"
                                ></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <!-- Formulário -->
                <form action="/login" method="POST" id="formLogin">

                    <!-- E-mail -->
                    <div class="form-group">

                        <label for="email" class="form-label">
                            <i class="bi bi-person"></i>
                            E-mail
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                            autofocus
                            value="{% if modo_teste == 'Sim' %}{{ email_padrao }}{% endif %}"
                        >

                    </div>

                    <!-- Senha -->
                    <div class="form-group password-group">

                        <label for="senha" class="form-label">
                            <i class="bi bi-lock"></i>
                            Senha
                        </label>

                        <div class="password-container">

                            <input
                                type="password"
                                class="form-control"
                                id="senha"
                                name="senha"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                                required
                                value="{% if modo_teste == 'Sim' %}{{ senha_padrao }}{% endif %}"
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleSenha"
                                aria-label="Mostrar senha"
                                aria-pressed="false"
                            >
                                <i class="bi bi-eye" aria-hidden="true"></i>
                            </button>

                        </div>

                    </div>

                    <!-- Opções -->
                    <div class="login-options">

                        <div class="remember-option">

                            <input
                                type="checkbox"
                                id="lembrar"
                                name="lembrar"
                                class="remember-checkbox"
                            >

                            <label for="lembrar">
                                Lembrar-me
                            </label>

                        </div>

                        <a href="#" class="forgot-password">
                            Esqueci a senha
                        </a>

                    </div>

                    <!-- Botão Entrar -->
                    <button
                        type="submit"
                        class="btn-login"
                        id="btnLogin"
                    >

                        <span class="button-content">
                            <i class="bi bi-box-arrow-in-right"></i>
                            Entrar
                        </span>

                        <span class="button-loading">

                            <span
                                class="spinner-border spinner-border-sm"
                                role="status"
                                aria-hidden="true"
                            ></span>

                            Autenticando...

                        </span>

                    </button>

                </form>

            </div>

        </section>

        <!-- Identificação do sistema -->
        <div class="system-version">
            Sistema Financeiro
        </div>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Funcionalidades do login -->
    <script>

        // ========================================
        // MOSTRAR E OCULTAR SENHA
        // ========================================

        const campoSenha = document.getElementById('senha');
        const botaoSenha = document.getElementById('toggleSenha');
        const iconeSenha = botaoSenha.querySelector('i');

        botaoSenha.addEventListener('click', function () {

            const mostrar = campoSenha.type === 'password';

            campoSenha.type = mostrar ? 'text' : 'password';

            iconeSenha.classList.toggle('bi-eye', !mostrar);
            iconeSenha.classList.toggle('bi-eye-slash', mostrar);

            botaoSenha.setAttribute(
                'aria-label',
                mostrar ? 'Ocultar senha' : 'Mostrar senha'
            );

            botaoSenha.setAttribute(
                'aria-pressed',
                String(mostrar)
            );

            campoSenha.focus();

        });


        // ========================================
        // ESTADO DE CARREGAMENTO DO BOTÃO
        // ========================================

        const formLogin = document.getElementById('formLogin');
        const btnLogin = document.getElementById('btnLogin');

        formLogin.addEventListener('submit', function (event) {

            if (!formLogin.checkValidity()) {
                return;
            }

            btnLogin.classList.add('loading');
            btnLogin.disabled = true;

        });


        // ========================================
        // VALIDAÇÃO PERSONALIZADA EM PORTUGUÊS
        // ========================================

        const campos = document.querySelectorAll(
            '#formLogin input'
        );

        campos.forEach(campo => {

            function validarCampo() {

                campo.setCustomValidity('');

                if (campo.validity.valueMissing) {

                    campo.setCustomValidity(
                        'Por favor, preencha este campo.'
                    );

                }

                else if (
                    campo.validity.typeMismatch &&
                    campo.type === 'email'
                ) {

                    const valor = campo.value.trim();

                    if (!valor.includes('@')) {

                        campo.setCustomValidity(
                            'Por favor, inclua um "@" no endereço de e-mail.'
                        );

                    } else {

                        campo.setCustomValidity(
                            'Por favor, informe um endereço de e-mail válido.'
                        );

                    }

                }

                else if (campo.validity.tooShort) {

                    campo.setCustomValidity(
                        'O valor informado é muito curto.'
                    );

                }

                else if (campo.validity.tooLong) {

                    campo.setCustomValidity(
                        'O valor informado é muito longo.'
                    );

                }

                else if (campo.validity.patternMismatch) {

                    campo.setCustomValidity(
                        'O formato informado é inválido.'
                    );

                }

            }


            // Validação ao enviar
            campo.addEventListener('invalid', validarCampo);


            // Limpa a mensagem ao digitar
            campo.addEventListener('input', function () {

                campo.setCustomValidity('');

            });


            // Validação ao sair do campo
            campo.addEventListener('blur', function () {

                if (campo.value !== '') {
                    validarCampo();
                }

            });

        });

    </script>

</body>

</html>
